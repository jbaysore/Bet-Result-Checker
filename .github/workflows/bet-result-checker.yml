name: Run Bet Result Checker
on:
  workflow_dispatch:
concurrency:
  group: bet-result-checker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: pytest -q
      - name: Run Bet Result Checker
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: Bets
        run: python trigger.py
      # Checker writes can exhaust the Sheets per-minute read quota; promo
      # updater is a fresh process (cold cache) and would 429 immediately.
      # Wait for the quota window to recover, and sheets_quota.py also
      # retries on 429 if the pause isn't enough.
      - name: Wait for Sheets quota window
        run: sleep 65
      - name: Run Promotion Updater
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: Bets
        run: python promo_trigger.py